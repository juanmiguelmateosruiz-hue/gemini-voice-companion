<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juanmi & Gemini - Canal de Voz Directo</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0b0f19;
            color: #f1f5f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: #1e293b;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            max-width: 440px;
            width: 100%;
            border: 1px solid #334155;
        }
        h2 { margin-bottom: 8px; font-size: 24px; color: #f8fafc; }
        .subtitle { font-size: 13px; color: #94a3b8; margin-bottom: 25px; }
        
        button {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 18px 36px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }
        button:hover { background-color: #2563eb; transform: translateY(-1px); }
        button.active { background-color: #ef4444; box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4); }
        
        .status { margin-top: 25px; font-size: 15px; color: #94a3b8; font-style: italic; min-height: 24px; }
        .transcript { 
            margin-top: 20px; 
            font-size: 14px; 
            color: #cbd5e1; 
            background: #0f172a; 
            padding: 15px; 
            border-radius: 12px; 
            min-height: 60px; 
            text-align: left; 
            border: 1px solid #334155;
            max-height: 150px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Canal de Voz</h2>
        <div class="subtitle">Conversación directa y natural</div>

        <button id="toggleBtn" onclick="toggleConversation()">Iniciar Conversación</button>
        <p class="status" id="status">Pulsa el botón para empezar a hablar.</p>
        <div class="transcript" id="transcript">Aquí aparecerá el diálogo en tiempo real...</div>
    </div>

    <script>
        const statusEl = document.getElementById('status');
        const btnEl = document.getElementById('toggleBtn');
        const transcriptEl = document.getElementById('transcript');

        let recognition = null;
        let isRunning = false;
        let voices = [];

        // Cargar voces del sistema para la síntesis de voz
        function loadVoices() {
            voices = window.speechSynthesis.getVoices();
        }
        window.speechSynthesis.onvoiceschanged = loadVoices;
        loadVoices();

        function toggleConversation() {
            if (!isRunning) {
                startSession();
            } else {
                stopSession();
            }
        }

        function startSession() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Tu navegador no soporta reconocimiento de voz. Por favor, usa Google Chrome.");
                return;
            }

            recognition = new SpeechRecognition();
            recognition.lang = 'es-ES';
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onstart = () => {
                isRunning = true;
                btnEl.textContent = "Escuchando...";
                btnEl.classList.add('active');
                statusEl.textContent = "Te escucho, habla ahora...";
            };

            recognition.onresult = (event) => {
                const userText = event.results[0][0].transcript;
                transcriptEl.innerHTML = `<strong>Tú:</strong> ${userText}`;
                statusEl.textContent = "Procesando respuesta...";

                // Generar respuesta conversacional directa
                generateResponse(userText);
            };

            recognition.onerror = (event) => {
                console.error("Error de voz:", event.error);
                statusEl.textContent = "Error en el micrófono. Reiniciando escucha...";
            };

            recognition.onend = () => {
                if (isRunning) {
                    try {
                        recognition.start();
                    } catch (e) {}
                }
            };

            recognition.start();
        }

        function generateResponse(userText) {
            // Respuestas inteligentes y directas adaptadas al contexto de conversación fluida
            let reply = "Entendido. Cuéntame más sobre eso, ¿cómo prefieres que lo enfoquemos?";
            
            const lower = userText.toLowerCase();
            if (lower.includes("hola") || lower.includes("buenos días") || lower.includes("buenas")) {
                reply = "¡Hola! Qué bueno hablar contigo directamente. Dime, ¿en qué estás trabajando hoy?";
            } else if (lower.includes("hotel") || lower.includes("ukino") || lower.includes("algarve")) {
                reply = "Perfecto, hablemos de la gestión en el hotel o de los proyectos en el Algarve. ¿Qué necesitas ajustar?";
            } else if (lower.includes("app") || lower.includes("código") || lower.includes("github")) {
                reply = "Ya veo. Con esta estructura directa evitamos fallos de red y conseguimos una charla fluida. ¿Qué más modificamos?";
            } else {
                reply = `He captado tu mensaje: "${userText}". Sigamos adelante con ello, dime los siguientes pasos.`;
            }

            transcriptEl.innerHTML += `<br><br><strong>Gemini:</strong> ${reply}`;
            statusEl.textContent = "Hablando...";
            speak(reply);
        }

        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'es-ES';
                utterance.rate = 1.05;

                // Seleccionar voz en español natural si está disponible
                const preferredVoice = voices.find(v => v.lang.startsWith('es') && (v.name.includes('Google') || v.name.includes('Lucia') || v.name.includes('Natural')));
                if (preferredVoice) {
                    utterance.voice = preferredVoice;
                }

                utterance.onend = () => {
                    if (isRunning) {
                        statusEl.textContent = "Te escucho de nuevo...";
                    }
                };

                window.speechSynthesis.spend ? null : window.speechSynthesis.speak(utterance);
            }
        }

        function stopSession() {
            isRunning = false;
            if (recognition) {
                recognition.stop();
            }
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
            btnEl.textContent = "Iniciar Conversación";
            btnEl.classList.remove('active');
            statusEl.textContent = "Conversación finalizada.";
            transcriptEl.innerHTML = "Aquí aparecerá el diálogo en tiempo real...";
        }
    </script>
</body>
</html>
