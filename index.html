<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Voice Companion</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: #1e293b;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            max-width: 400px;
            width: 100%;
            position: relative;
        }
        button {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 20px;
        }
        button:hover { background-color: #2563eb; }
        button.active { background-color: #ef4444; }
        .status { margin-top: 15px; font-size: 14px; color: #94a3b8; }
        .config-box { margin-bottom: 20px; text-align: left; }
        input[type="password"] {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            box-sizing: border-box;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Asistente de Voz</h2>
        
        <div class="config-box">
            <label for="apiKey" style="font-size: 12px; color: #94a3b8;">Clave API de Gemini:</label>
            <input type="password" id="apiKey" placeholder="Pega tu API Key aquí...">
        </div>

        <p class="status" id="status">Introduce tu clave y pulsa Iniciar</p>
        <button id="toggleBtn" onclick="toggleCall()">Iniciar Conversación</button>
    </div>

    <script>
        let isConnected = false;
        const statusEl = document.getElementById('status');
        const btnEl = document.getElementById('toggleBtn');
        let mediaStream = null;

        async function toggleCall() {
            const apiKey = document.getElementById('apiKey').value.trim();
            if (!apiKey) {
                alert("Por favor, introduce primero tu clave de API de Gemini.");
                return;
            }

            if (!isConnected) {
                try {
                    statusEl.textContent = "Solicitando acceso al micrófono...";
                    mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    
                    isConnected = true;
                    statusEl.textContent = "Conversación activa. Habla ahora...";
                    btnEl.textContent = "Colgar";
                    btnEl.classList.add('active');
                } catch (err) {
                    console.error(err);
                    statusEl.textContent = "Error: No se pudo acceder al micrófono.";
                }
            } else {
                stopCall();
            }
        }

        function stopCall() {
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
            }
            isConnected = false;
            statusEl.textContent = "Desconectado";
            btnEl.textContent = "Iniciar Conversación";
            btnEl.classList.remove('active');
        }
    </script>
</body>
</html>
