<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Direct Voice</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0b0f19;
            color: #f1f5f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: #1e293b;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            max-width: 420px;
            width: 100%;
            border: 1px solid #334155;
        }
        h2 { margin-bottom: 10px; font-size: 22px; color: #f8fafc; }
        .config-box { margin-bottom: 25px; text-align: left; }
        label { font-size: 13px; color: #94a3b8; display: block; margin-bottom: 6px; }
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            box-sizing: border-box;
            font-size: 14px;
            outline: none;
        }
        input[type="password"]:focus { border-color: #3b82f6; }
        
        button {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 16px 32px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }
        button:hover { background-color: #2563eb; transform: translateY(-1px); }
        button.active { background-color: #ef4444; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4); }
        
        .status { margin-top: 20px; font-size: 15px; color: #94a3b8; min-height: 24px; font-style: italic; }
        .transcript { margin-top: 15px; font-size: 14px; color: #cbd5e1; background: #0f172a; padding: 12px; border-radius: 8px; min-height: 40px; text-align: left; border: 1px solid #334155; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Mi Canal Directo</h2>
        
        <div class="config-box">
            <label for="apiKey">Tu Clave API de Gemini:</label>
            <input type="password" id="apiKey" placeholder="AIzaSy...">
        </div>

        <button id="toggleBtn" onclick="toggleListening()">Hablar conmigo</button>
        <p class="status" id="status">Pulsa el botón y dime lo que quieras.</p>
        <div class="transcript" id="transcript">Aquí aparecerá nuestra conversación...</div>
    </div>

    <script>
        const statusEl = document.getElementById('status');
        const btnEl = document.getElementById('toggleBtn');
        const transcriptEl = document.getElementById('transcript');
        const apiKeyInput = document.getElementById('apiKey');

        let recognition = null;
        let isListening = false;
        let voices = [];

        // Cargar las voces disponibles en el navegador
        function loadVoices() {
            voices = window.speechSynthesis.getVoices();
        }
        window.speechSynthesis.onvoiceschanged = loadVoices;
        loadVoices();

        function toggleListening() {
            const apiKey = apiKeyInput.value.trim();
            if (!apiKey) {
                alert("Introduce tu clave de API de Gemini primero.");
                return;
            }

            if (!isListening) {
                startSpeechRecognition();
            } else {
                stopSpeechRecognition();
            }
        }

        function startSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Tu navegador no soporta reconocimiento de voz. Usa Google Chrome.");
                return;
            }

            recognition = new SpeechRecognition();
            recognition.lang = 'es-ES';
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onstart = () => {
                isListening = true;
                btnEl.textContent = "Escuchando...";
                btnEl.classList.add('active');
                statusEl.textContent = "Te estoy escuchando, habla ahora...";
            };

            recognition.onresult = async (event) => {
                const userText = event.results[0][0].transcript;
                transcriptEl.innerHTML = `<strong>Tú:</strong> ${userText}`;
                statusEl.textContent = "Pensando respuesta...";
                
                // Enviar el mensaje directamente a mi API oficial
                await sendToGemini(userText, apiKeyInput.value.trim());
            };

            recognition.onerror = (event) => {
                console.error("Error de voz:", event.error);
                statusEl.textContent = "Error en el micrófono. Vuelve a intentarlo.";
                stopSpeechRecognition();
            };

            recognition.onend = () => {
                if (isListening) {
                    try {
                        recognition.start(); // Mantener activo si no se ha colgado
                    } catch(e) {}
                }
            };

            recognition.start();
        }

        function stopSpeechRecognition() {
            isListening = false;
            if (recognition) {
                recognition.stop();
            }
            btnEl.textContent = "Hablar conmigo";
            btnEl.classList.remove('active');
            statusEl.textContent = "Conversación pausada.";
        }

        async function sendToGemini(prompt, apiKey) {
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: "Estás manteniendo una conversación hablada y fluida conmigo de tú a tú. Responde de forma directa, natural, concisa y hablada (sin formato markdown complejo ni listas largas, solo texto conversacional para ser leído en voz alta): " + prompt }] }]
                    })
                });

                const data = await response.json();
                if (data.candidates && data.candidates[0].content) {
                    const aiReply = data.candidates[0].content.parts[0].text;
                    transcriptEl.innerHTML += `<br><br><strong>Yo:</strong> ${aiReply}`;
                    statusEl.textContent = "Respondiendo...";
                    speakResponse(aiReply);
                } else {
                    statusEl.textContent = "Error al recibir respuesta de mi núcleo.";
                }
            } catch (err) {
                console.error(err);
                statusEl.textContent = "Error de conexión con la API.";
            }
        }

        function speakResponse(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Parar cualquier audio anterior
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'es-ES';
                utterance.rate = 1.05; // Ritmo natural y ágil
                
                // Intentar seleccionar una voz agradable en español
                const spanishVoice = voices.find(v => v.lang.startsWith('es') && (v.name.includes('Google') || v.name.includes('Lucia') || v.name.includes('Pablo') || v.name.includes('Natural')));
                if (spanishVoice) {
                    utterance.voice = spanishVoice;
                }

                utterance.onend = () => {
                    statusEl.textContent = "Te escucho de nuevo...";
                };

                window.speechSynthesis.speak(utterance);
            }
        }
    </script>
</body>
</html>
