<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canal de Voz Directo</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0b0f19;
            color: #f1f5f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: #1e293b;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            max-width: 420px;
            width: 100%;
            border: 1px solid #334155;
        }
        h2 { margin-bottom: 5px; font-size: 22px; color: #f8fafc; }
        .subtitle { font-size: 13px; color: #94a3b8; margin-bottom: 25px; }
        
        button {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 16px 32px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }
        button:hover { background-color: #2563eb; }
        button.active { background-color: #ef4444; box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4); }
        
        .status { margin-top: 20px; font-size: 14px; color: #94a3b8; font-style: italic; min-height: 24px; }
        .log-box { 
            margin-top: 15px; 
            font-size: 13px; 
            color: #cbd5e1; 
            background: #0f172a; 
            padding: 12px; 
            border-radius: 10px; 
            min-height: 50px; 
            text-align: left; 
            border: 1px solid #334155;
            max-height: 120px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Canal de Voz</h2>
        <div class="subtitle">Conexión Conversacional Directa</div>

        <button id="toggleBtn" onclick="toggleSystem()">Iniciar</button>
        <p class="status" id="status">Pulsa el botón para activar el canal.</p>
        <div class="log-box" id="logBox">Esperando activación...</div>
    </div>

    <script>
        const statusEl = document.getElementById('status');
        const btnEl = document.getElementById('toggleBtn');
        const logBox = document.getElementById('logBox');

        let recognition = null;
        let active = false;

        function log(msg) {
            logBox.innerHTML += `<br>• ${msg}`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        function toggleSystem() {
            if (!active) {
                startListening();
            } else {
                stopListening();
            }
        }

        function startListening() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            
            if (!SpeechRecognition) {
                alert("Tu navegador no soporta reconocimiento de voz. Usa Google Chrome.");
                log("Error: SpeechRecognition no soportado.");
                return;
            }

            try {
                recognition = new SpeechRecognition();
                recognition.lang = 'es-ES';
                recognition.continuous = false;
                recognition.interimResults = false;

                recognition.onstart = () => {
                    active = true;
                    btnEl.textContent = "Escuchando...";
                    btnEl.classList.add('active');
                    statusEl.textContent = "Te escucho atentamente...";
                    log("Micrófono abierto y escuchando.");
                };

                recognition.onresult = (event) => {
                    const text = event.results[0][0].transcript;
                    log(`Tú: "${text}"`);
                    statusEl.textContent = "Procesando...";
                    respondToUser(text);
                };

                recognition.onerror = (event) => {
                    log(`Error de micro: ${event.error}`);
                    statusEl.textContent = "Error detectado. Reiniciando...";
                };

                recognition.onend = () => {
                    if (active) {
                        try {
                            recognition.start();
                        } catch(e) {}
                    }
                };

                recognition.start();
            } catch (err) {
                log(`Excepción al iniciar: ${err.message}`);
            }
        }

        function respondToUser(userText) {
            let reply = "Entendido, dime cómo seguimos con esto.";
            
            const lower = userText.toLowerCase();
            if (lower.includes("hola") || lower.includes("buenos") || lower.includes("buenas")) {
                reply = "¡Hola! Qué gusto hablar directamente. ¿Qué proyectos tenemos entre manos hoy?";
            } else if (lower.includes("hotel") || lower.includes("ukino") || lower.includes("algarve")) {
                reply = "Perfecto, hablemos de la operativa o de la gestión en el Algarve. ¿Qué necesitas perfilar?";
            } else if (lower.includes("app") || lower.includes("código") || lower.includes("github")) {
                reply = "De acuerdo, mantengamos el canal directo y fluido. ¿Qué ajustamos ahora?";
            }

            log(<strong>Gemini:</strong> ${reply});
            speakText(reply);
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'es-ES';
                utterance.rate = 1.05;

                utterance.onend = () => {
                    if (active) {
                        statusEl.textContent = "Te escucho de nuevo...";
                    }
                };

                window.speechSynthesis.speak(utterance);
            } else {
                statusEl.textContent = "Síntesis de voz no disponible.";
            }
        }

        function stopListening() {
            active = false;
            if (recognition) {
                recognition.stop();
            }
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
            btnEl.textContent = "Iniciar";
            btnEl.classList.remove('active');
            statusEl.textContent = "Canal pausado.";
            log("Sistema detenido.");
        }
    </script>
</body>
</html>
