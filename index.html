<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Voice Companion</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0b0f19;
            color: #f1f5f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: #1e293b;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            max-width: 440px;
            width: 100%;
            border: 1px solid #334155;
        }
        h2 { margin-bottom: 8px; font-size: 22px; color: #f8fafc; }
        .config-box { margin-bottom: 20px; text-align: left; }
        label { font-size: 12px; color: #94a3b8; display: block; margin-bottom: 6px; }
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            box-sizing: border-box;
            font-size: 14px;
            outline: none;
        }
        button {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 16px 32px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
            width: 100%;
        }
        button:hover { background-color: #2563eb; }
        button.active { background-color: #ef4444; box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4); }
        .status { margin-top: 20px; font-size: 14px; color: #94a3b8; font-style: italic; min-height: 24px; }
        .transcript { 
            margin-top: 15px; 
            font-size: 13px; 
            color: #cbd5e1; 
            background: #0f172a; 
            padding: 12px; 
            border-radius: 10px; 
            min-height: 80px; 
            text-align: left; 
            border: 1px solid #334155;
            max-height: 160px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Canal de Voz Directo</h2>
        
        <div class="config-box">
            <label for="apiKey">Tu clave API de Google AI Studio:</label>
            <input type="password" id="apiKey" placeholder="AIzaSy..." oninput="saveApiKey(this.value)">
        </div>

        <button id="toggleBtn" onclick="toggleSession()">Iniciar Conversación</button>
        <p class="status" id="status">Pulsa Iniciar para hablar.</p>
        <div class="transcript" id="transcript">Diálogo en tiempo real...</div>
    </div>

    <script>
        let recognition = null;
        let isRunning = false;
        const statusEl = document.getElementById('status');
        const btnEl = document.getElementById('toggleBtn');
        const transcriptEl = document.getElementById('transcript');
        const apiKeyInput = document.getElementById('apiKey');

        // Cargar automáticamente la clave API guardada en el navegador al abrir la página
        window.addEventListener('DOMContentLoaded', () => {
            const savedKey = localStorage.getItem('gemini_user_api_key');
            if (savedKey) {
                apiKeyInput.value = savedKey;
                statusEl.textContent = "API Key recuperada. Pulsa Iniciar.";
            }
        });

        function saveApiKey(value) {
            localStorage.setItem('gemini_user_api_key', value.trim());
        }

        function toggleSession() {
            const apiKey = apiKeyInput.value.trim();
            if (!apiKey) {
                alert("Por favor, introduce tu clave API.");
                return;
            }

            if (!isRunning) {
                startListening(apiKey);
            } else {
                stopSession();
            }
        }

        function startListening(apiKey) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Tu navegador no soporta reconocimiento de voz. Usa Google Chrome.");
                return;
            }

            recognition = new SpeechRecognition();
            recognition.lang = 'es-ES';
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onstart = () => {
                isRunning = true;
                btnEl.textContent = "Colgar";
                btnEl.classList.add('active');
                statusEl.textContent = "Te escucho, habla ahora...";
            };

            recognition.onresult = async (event) => {
                const userText = event.results[0][0].transcript;
                
                if (transcriptEl.innerHTML.includes("Diálogo en tiempo real")) {
                    transcriptEl.innerHTML = "";
                }
                transcriptEl.innerHTML += `<br><strong>Tú:</strong> ${userText}`;
                transcriptEl.scrollTop = transcriptEl.scrollHeight;
                
                statusEl.textContent = "Pensando respuesta...";
                await sendToGemini(userText, apiKey);
            };

            recognition.onerror = (event) => {
                console.warn("Aviso de micro:", event.error);
                statusEl.textContent = "Aviso de micrófono: " + event.error;
            };

            recognition.onend = () => {
                if (isRunning) {
                    try { recognition.start(); } catch(e) {}
                }
            };

            recognition.start();
        }

        async function sendToGemini(prompt, apiKey) {
            // Rotación inteligente de modelos soportados por la API HTTP actual
            const models = ["gemini-1.5-flash", "gemini-1.5-pro", "gemini-2.0-flash"];
            let replyReceived = false;

            for (const model of models) {
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ 
                                parts: [{ 
                                    text: "Eres Gemini, manteniendo una conversación de voz fluida, natural y directa con Juanmi. Responde de forma concisa y conversacional (sin formato markdown complejo ni listas largas, solo texto claro para ser leído en voz alta): " + prompt 
                                }] 
                            }]
                        })
                    });

                    const data = await response.json();
                    
                    if (data.candidates && data.candidates[0].content) {
                        const aiReply = data.candidates[0].content.parts[0].text;
                        transcriptEl.innerHTML += `<br><strong>Gemini:</strong> ${aiReply}`;
                        transcriptEl.scrollTop = transcriptEl.scrollHeight;
                        statusEl.textContent = "Hablando...";
                        speakResponse(aiReply);
                        replyReceived = true;
                        break;
                    }
                } catch (e) {
                    console.warn(`Fallo con el modelo ${model}, intentando siguiente...`);
                }
            }

            if (!replyReceived) {
                statusEl.textContent = "Error de comunicación con la API.";
                transcriptEl.innerHTML += `<br><span style="color: #ef4444;">[Error: No se pudo conectar con los modelos. Comprueba tu API Key]</span>`;
            }
        }

        function speakResponse(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'es-ES';
                utterance.rate = 1.05;

                utterance.onend = () => {
                    if (isRunning) {
                        statusEl.textContent = "Te escucho de nuevo...";
                    }
                };

                window.speechSynthesis.speak(utterance);
            }
        }

        function stopSession() {
            isRunning = false;
            if (recognition) {
                recognition.stop();
            }
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
            btnEl.textContent = "Iniciar Conversación";
            btnEl.classList.remove('active');
            statusEl.textContent = "Conversación finalizada.";
        }
    </script>
</body>
</html>
